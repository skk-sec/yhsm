name: Verify Stage-0 bootstrap integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - README.md
      - bootstrap.sh
      - .github/workflows/bootstrap-integrity.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - bootstrap.sh
      - .github/workflows/bootstrap-integrity.yml

permissions:
  contents: read

jobs:
  integrity:
    name: README pin matches bootstrap bytes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Verify immutable bootstrap pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          local_bootstrap = Path("bootstrap.sh").read_bytes()
          url_pattern = re.compile(
              r"https://raw\.githubusercontent\.com/skk-sec/yhsm/"
              r"(?P<ref>[^/\s'\"]+)/bootstrap\.sh"
              r"(?![A-Za-z0-9._/-])"
          )
          urls = list(url_pattern.finditer(readme))
          command_pattern = re.compile(
              r"(?m)^curl -fsSLo bootstrap\.sh "
              r"https://raw\.githubusercontent\.com/skk-sec/yhsm/"
              r"(?P<ref>[^/\s'\"]+)/bootstrap\.sh"
              r"(?![A-Za-z0-9._/-]) && echo "
              r"'(?P<sha>[0-9a-f]{64})  bootstrap\.sh' \| sha256sum -c -$"
          )
          commands = list(command_pattern.finditer(readme))
          if len(urls) != 1 or len(commands) != 1:
              raise SystemExit(
                  "expected exactly one complete immutable bootstrap command and URL"
              )
          ref = commands[0].group("ref")
          pinned = commands[0].group("sha")
          if urls[0].group("ref") != ref:
              raise SystemExit("README contains inconsistent bootstrap URLs")
          if not re.fullmatch(r"[0-9a-f]{40}", ref):
              raise SystemExit(
                  f"Public bootstrap ref must be one immutable commit SHA, got {ref!r}"
              )
          url = f"https://raw.githubusercontent.com/skk-sec/yhsm/{ref}/bootstrap.sh"
          request = Request(url, headers={"User-Agent": "yhsm-stage0-integrity-guard/1"})
          try:
              with urlopen(request, timeout=20) as response:
                  remote_bootstrap = response.read()
          except Exception as exc:
              raise SystemExit(
                  f"unable to fetch Public bootstrap at immutable commit {ref}: {exc}"
              ) from exc
          if remote_bootstrap != local_bootstrap:
              raise SystemExit(
                  "checked-out bootstrap.sh does not match the bytes served at the pinned Public commit"
              )
          actual = sha256(remote_bootstrap).hexdigest()
          if pinned != actual:
              raise SystemExit(
                  f"README SHA-256 {pinned} does not match pinned Public bytes {actual}"
              )
          print(f"public_commit={ref}")
          print(f"bootstrap_sha256={actual}")
          print("integrity=OK")
          PY
